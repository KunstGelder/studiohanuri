<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — Studio Hanuri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#2a4a9d;--cream:#f6f3ec;--ink:#1a1a22;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;}
.box{max-width:480px;}
.icon{font-size:3rem;margin-bottom:1.5rem;}
h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:2.2rem;color:var(--navy);margin-bottom:1rem;}
p{font-size:1.05rem;line-height:1.75;color:#4a4a55;margin-bottom:2rem;}
a{display:inline-block;padding:.8rem 2rem;border:1.5px solid var(--navy);border-radius:40px;font-size:.85rem;font-weight:600;letter-spacing:.06em;color:var(--navy);text-decoration:none;transition:all .3s ease;}
a:hover{background:var(--navy);color:#fff;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">✉️</div>
  <h1>Thank you!</h1>
  <p>We've received your message and will get back to you soon.</p>
  <a href="/">← Back to Studio Hanuri</a>
</div>
</body>
</html>
