name: Generate manifest

# _data/blog 또는 _data/portfolio 에 변화가 생기면 실행
on:
  push:
    branches: [main]
    paths:
      - '_data/blog/**'
      - '_data/portfolio/**'
  workflow_dispatch:   # 수동 실행도 가능

# manifest.json을 커밋하려면 쓰기 권한 필요
permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate manifest files
        run: node generate-manifest.js

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/blog/manifest.json _data/portfolio/manifest.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "manifest 변경 없음"
          else
            git commit -m "Auto-update manifest [skip ci]"
            git push
          fi
